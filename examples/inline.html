<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>inline styles</title>
  <style>
    body { margin: 0; height: 100vh; display: grid; place-items: center; background: #101418; }
    .loader { display: flex; gap: 10px; }
    .loader span {
      width: 18px; height: 18px; border-radius: 50%; background: #5eead4;
      animation: pulse 900ms ease-in-out infinite;
    }
    .loader span:nth-child(2) { animation-delay: 150ms; }
    .loader span:nth-child(3) { animation-delay: 300ms; }
    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="loader"><span></span><span></span><span></span></div>
</body>
</html>
