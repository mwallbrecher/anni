<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>anni</title>
  <link rel="icon" type="image/png" sizes="64x64" href="brand/icon-64.png">
  <link rel="apple-touch-icon" sizes="192x192" href="brand/icon-192.png">
  <meta name="theme-color" content="#e97130">
  <link rel="preload" href="fonts/DepartureMono.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" title="anni"><img class="logo" src="brand/anni-logo.png" alt="anni"></a>
    <div class="file" id="file"></div>
    <select id="anim-select" title="Animation"></select>
    <div class="seg" id="view" hidden>
      <button data-view="editor" title="Edit the styles of the picked element">Editor</button>
      <button data-view="animate" title="Timeline and keyframes">Animate</button>
    </div>
    <div class="spacer"></div>
    <button class="ghost" id="export" hidden>Export changes</button>
    <button class="ghost" id="access" title="Who can open this session" hidden></button>
    <button class="ghost" id="undo" title="Undo (Ctrl+Z)">↶</button>
    <button class="ghost" id="redo" title="Redo (Ctrl+Shift+Z)">↷</button>
    <span class="dirty" id="dirty" hidden>● unsaved</span>
    <button class="primary" id="save" title="Write to file (Ctrl+S)">Save</button>
    <button class="ghost" id="keys" title="Shortcuts and mouse controls (?)" aria-label="Shortcuts and mouse controls">
      <svg viewBox="0 0 20 14" width="18" height="13" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="0.65" y="0.65" width="18.7" height="12.7" rx="1.6"/><path d="M4 4.2h1.2M7.4 4.2h1.2M10.8 4.2h1.2M14.2 4.2h1.6M4 7h1.6M8 7h1.2M11.4 7h1.2M14.4 7h1.4M6 9.8h8"/></svg>
    </button>
  </header>

  <div id="bars">
    <div class="banner" id="banner" hidden></div>
    <div class="banner access-bar" id="access-bar" hidden></div>
  </div>

  <main class="workspace" id="workspace" hidden>
    <section class="stage">
      <div class="stage-bar">
        <div class="seg" id="mode">
          <button data-mode="page">Page</button>
          <button data-mode="demo">Demo box</button>
        </div>
        <button id="pick" title="Pick an element on the page (V, Esc cancels)">⌖ Pick element</button>
        <span class="muted" id="stage-info"></span>
        <span class="spacer"></span>
        <button id="zoom" class="readout" title="Pinch or ⌘/Ctrl + wheel to zoom, wheel to pan · click or press 0 to reset" hidden>100%</button>
      </div>
      <div class="frame-wrap"><iframe id="frame" title="Preview"></iframe></div>
    </section>
    <aside class="inspector" id="inspector"></aside>
    <div class="resizer resizer-col" id="panel-resizer" title="Drag to resize the panel · double-click to reset"></div>
  </main>

  <section class="timeline" id="timeline" hidden>
    <div class="resizer resizer-row" id="tl-resizer" title="Drag to resize the timeline · double-click to reset"></div>
    <div class="transport">
      <button class="icon" id="play" title="Play / pause (Space)">▶</button>
      <button class="icon" id="rewind" title="Back to start">⏮</button>
      <div class="time" id="time">
        <input id="t-now" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" data-expr data-step="10" title="Playhead time – type to jump; with the playhead on selected keyframes, they move along" aria-label="Playhead time in ms">
        <span>/</span>
        <input id="t-dur" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" data-expr data-step="10" aria-label="Timeline length in ms">
        <span>ms</span>
      </div>
      <label class="check"><input type="checkbox" id="loop" checked> Loop</label>
      <select id="speed" title="Speed">
        <option value="0.1">0.1×</option>
        <option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
      </select>
      <div class="spacer"></div>
      <button id="tl-zoom" class="readout" title="Timeline zoom: pinch or ⌘/Ctrl + wheel, Shift + wheel pans · click or press 0 to fit" hidden>1.0× · fit</button>
      <button id="add-kf">+ Keyframe at playhead</button>
    </div>
    <div class="tracks" id="tracks"></div>
  </section>

  <div class="empty" id="empty" hidden>
    <div class="empty-card">
      <img class="logo big" src="brand/anni-logo.png" alt="anni">
      <h1>No animation open</h1>
      <p>Tell your agent something like <code>open the bounce animation from styles.css in anni</code>.</p>
      <p class="muted">Or from a terminal: <code>node src/cli.js path/to/file.css</code></p>
    </div>
    <footer class="site-footer">
      Built with
      <svg class="heart" viewBox="0 0 7 6" width="11" height="10" role="img" aria-label="love" shape-rendering="crispEdges"><path fill="currentColor" d="M1 0h2v1h1V0h2v1h1v2H6v1H5v1H4v1H3V5H2V4H1V3H0V1h1z"/></svg>
      by <a href="https://moritzwallbrecher.com" target="_blank" rel="noopener">Moritz Wallbrecher</a>
      <a href="https://syntwin.ai" target="_blank" rel="noopener">@syntwin</a>
    </footer>
  </div>

  <div class="toast" id="toast"></div>
  <datalist id="prop-list"></datalist>
  <script src="app.js" type="module"></script>
</body>
</html>
